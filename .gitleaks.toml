title = "Agent Assure Gitleaks configuration"
minVersion = "v8.30.1"

[extend]
useDefault = true

# These ten values are deterministic HMAC pseudonyms derived from the public
# synthetic fixture key. They are not credentials. The exception remains
# fail-closed for every other rule, path, match shape, and value. Character
# classes split the literals so this configuration does not detect itself.
[[allowlists]]
description = "Reviewed deterministic release-evidence subject pseudonyms"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^subject[_]token=(?:2d2c91326b2be450[a]0ad68c91b839114|3340634875ca5bad[1]705a34dac2d9d6a|482b6495dde24a13[a]f130b9669f1f300|48bfa9c1171c3e2a[f]8ebf2781eb6b2d6|51613abdb9472b49[7]d0e3e20a9515771|65d3933e144abc0e[5]76cb4d829ca2f80|746e2acf6b5ba818[7]98d28b77c5a1556|7892763db705f1a5[0]c36adc699c89ed5|b6e14d19c8b8e2e6[8]454eb29f9518234|c5bf9ffc9e6eede9[e]8330a6a722b217a);$''']
paths = [
  '''^evidence/synthetic/release-control-efficacy/runset\.json$''',
  '''^evidence/synthetic/release-control-efficacy/mutation-results/operator-000-mutated-runset\.json$''',
  '''^evidence/synthetic/release-control-efficacy/mutation-results/operator-001-mutated-runset\.json$''',
  '''^evidence/synthetic/release-control-efficacy/mutation-results/operator-002-mutated-runset\.json$''',
  '''^evidence/synthetic/release-control-efficacy/mutation-results/operator-003-mutated-runset\.json$''',
  '''^evidence/synthetic/release-control-efficacy/mutation-results/operator-004-mutated-runset\.json$''',
  '''^evidence/synthetic/release-control-efficacy/mutation-results/operator-005-mutated-runset\.json$''',
  '''^evidence/synthetic/release-control-efficacy/mutation-results/operator-006-mutated-runset\.json$''',
]

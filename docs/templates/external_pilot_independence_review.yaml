# Human attestations only. Keep this file outside the closed pilot bundle.
# Every false value must be deliberately changed to true only after that review
# is actually completed. The untouched template is intentionally invalid. The CLI derives
# all pilot IDs, digests, artifact bindings, and the release line from verified
# bundle bytes; attempts to supply those fields are rejected.
receipt_id: replace-review-receipt-id
reviewer_pseudonym: replace-release-reviewer-pseudonym
manual_approval_is_trust_root: false
reviewer_independent_of_pilot_execution: false
reviewer_independence_rationale: Replace with the privacy-safe basis for reviewer independence.
environment_control_evidence_reviewed: false
artifact_inventory_reviewed: false
tested_distribution_provenance_reviewed: false
command_input_bindings_reviewed: false
# Assert true only after independently hashing the exact non-bundled input
# bytes supplied to execution and matching every manifest content_sha256.
execution_time_input_content_digests_reviewed: false
# Assert true only after deriving each semantic identity from those same input
# bytes and matching the manifest; the bundle then compares those identities
# with every supported assurance output.
input_semantic_identities_reviewed: false
# Assert true only when the digest-bound consent record explicitly covers the
# evidence descriptor, this generated receipt, and every declared artifact.
complete_bundle_publication_consent_reviewed: false

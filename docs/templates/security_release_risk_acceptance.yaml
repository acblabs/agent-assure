# Public blank template only. Store completed records and sensitive evidence in
# an access-controlled incident or risk system, never in this repository.
record_schema: agent-assure/security-correction-risk-acceptance/v1
record_id: ""
status: draft  # draft | active | rejected | revoked | expired | closed
confidentiality: restricted

authority_boundary:
  operational_risk_acceptance_only: true
  merge: false
  tag_creation: false
  signing: false
  github_release: false
  testpypi_publication: false
  pypi_publication: false
  release_gate_exception: false
  acknowledgement: >-
    This record has no publication authority and cannot waive, replace, or
    satisfy any standard release gate.

intake_policy:
  policy_id: agent-assure/security-vulnerability-intake/v1
  policy_revision: v1
  clock_basis: earliest_report_receipt_or_internal_detection

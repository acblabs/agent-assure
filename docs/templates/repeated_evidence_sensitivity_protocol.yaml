limitations:
  - Counts and rates describe only the exact frozen case-cluster frame; no independence, exchangeability, sampling, or population claim is made.
  - Digest commitments bind configuration identity but do not externally timestamp an execution or prevent selection among identical-commitment reruns.
  - Exact per-case authority bindings prove internal agreement with the loaded frozen corpus and compiled query scope; they do not prove real-world legal or domain authority or source authenticity.
  - Missing, excluded, or invalid planned evidence makes the descriptive frame incomplete and prohibits a completed descriptive result.
  - Repeated calls within a cluster are repeated observations, not additional frame units.
  - Results do not establish causal effects, general model quality, provider-wide behavior, safety, or compliance.
  - Sequential arm execution does not establish shared provider randomness or temporal conditions.
  - The descriptive denominator is the full frozen cluster frame, never a post hoc analyzable subset.
  - The zero maximum exclusion rate is a frame-completeness invariant, not an inferential parameter.
  - The protocol persists bounded structured decisions and digests, not credentials, prompts, completions, or raw tool payloads.
  - Version 1 requires balanced planned cluster composition.
  - With repetitions_per_arm greater than one, every planned pair must satisfy the endpoint for its cluster to count as a response.

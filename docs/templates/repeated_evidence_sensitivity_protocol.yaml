limitations:
  - Cluster independence and exchangeability are authored modeling assumptions, not empirically verified prerequisites.
  - Digest commitments bind configuration identity but do not externally timestamp an execution or prevent selection among identical-commitment reruns.
  - Exact inference assumes independent, exchangeable binary cluster endpoints with a common null response probability.
  - Exact per-case authority bindings prove internal agreement with the loaded frozen corpus and compiled query scope; they do not prove real-world legal or domain authority or source authenticity.
  - Population inference is conditional on the strict all-planned-pairs cluster endpoint and the frozen sampling frame.
  - Repeated calls within a cluster are not independent inferential units.
  - Results do not establish causal effects, general model quality, provider-wide behavior, safety, or compliance.
  - Sequential arm execution does not establish shared provider randomness or temporal conditions.
  - The declared null and alternative response rates and estimated response rate apply to the fixed planned-frame composite endpoint, not response conditional on analyzability.
  - The maximum exclusion rate is an audit cap and does not inflate or reduce the fixed inferential frame.
  - The protocol persists bounded structured decisions and digests, not credentials, prompts, completions, or raw tool payloads.
  - Version 1 requires balanced planned cluster composition.
  - With repetitions_per_arm greater than one, the all-pairs composite probability changes with the repetition count and repetitions do not increase inferential N.

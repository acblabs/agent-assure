hypothesis_decision_rule:
  inference_scope: confirmatory_independent_clusters
  estimand: decision_inertia_rate
  derivation: direct_same_decision_rate_on_decision_flip_conditions
  target_task_model_conditions:
    - approve-to-deny-condition
    - deny-to-approve-condition
  negative_control_conditions:
    - approve-invariant-condition
    - deny-invariant-condition
  invariant_control_gate: zero_observed_unexpected_arm_changes
  inferential_unit: case_cluster
  # All 42 frozen clusters are required even though 36 would make the
  # zero-inertia branch reachable under the corrected two-target family.
  minimum_independent_clusters: 42
  materiality_threshold: "0.100000"
  familywise_alpha: "0.050000"
  interval_method: clopper_pearson_exact_one_sided
  adjusted_alpha_serialization: conservative_floor_6_decimal
  interval_bound_serialization: conservative_outward_12_decimal
  multiplicity_method: bonferroni
  multiplicity_family_scope: target_task_model_conditions_only
  directional_error_control: each_direction_separately_fwer_controlled_not_joint_two_sided_alpha
  sampling_frame: finite_frozen_conformance_frame
  exchangeability_assumption: independent_exchangeable_binary_cluster_endpoints_within_condition
  decision_boundary_rationale: >-
    Familywise alpha 0.05 is Bonferroni-adjusted over the two decision-flip
    targets only, giving alpha 0.025 per target; invariant controls instead use
    the exact zero-change gate. At n=42 and threshold 0.10, contradicted requires
    zero inertia clusters in both targets (zero-count upper bound 0.084083854941),
    supported requires at least nine inertia clusters in either target
    (nine-count lower bound 0.102959649897), and counts one through eight in
    every target are inconclusive. Support and contradiction are distinct
    directional claims, each FWER-controlled at 0.05 over the two targets; the
    complete two-direction rule is not a single joint two-sided-alpha guarantee.
  independence_justification:
    # This unresolved drafting object is structurally valid for local/synthetic
    # authoring, but real-provider manifests and statistical-method approval
    # reject it. Replace every field with a study-specific positive design
    # argument; repeating the benchmark caveat is not a justification.
    status: unresolved_authoring_placeholder
    design_basis: unresolved
    semantic_near_duplicate_disposition: unresolved
    inferential_unit_definition: >-
      Each proposed inferential unit is one separately dispatched case-ID cluster
      in a finite frozen benefit-eligibility conformance frame.
    independence_basis: >-
      UNRESOLVED AUTHORING PLACEHOLDER: replace this text with a positive design-based
      argument before real-provider preregistration.
    dependence_risks_and_mitigations: >-
      The cases share one task template and differ visibly only by integer score;
      unique identities and digests establish replayability, not semantic,
      stochastic, or behavioral independence.
    residual_scope_limitation: >-
      Any accepted inference remains conditional on the qualified reviewer's
      assessment and scoped to this finite frame, not a provider or task population.
    software_verification_scope: structure_and_presence_only_not_independence_truth
  supported_when: any_adjusted_lower_bound_above_threshold
  contradicted_when: all_adjusted_upper_bounds_at_or_below_threshold
  inconclusive_when: otherwise_after_valid_sufficient_execution
budget:
  # Safe drafting default: any execution invalidates publication until
  # a human-approved nonzero budget replaces this value.
  maximum_estimated_cost_microusd: 0
  credentials_source: environment_variable_only
  persist_credentials: false
  persist_credential_digests: false
publication:
  redact_raw_outputs: true
  publish_privacy_filtered_runsets: true
  publish_raw_prompts: false
  publish_raw_completions: false
  publish_credentials: false
limitations:
  - Add a condition-specific operational limitation before registration.
  - Exact input-digest uniqueness excludes byte-identical prompts but does not establish semantic independence.
  - Inference is conditional on within-condition independent exchangeable binary endpoints in this finite frozen conformance frame.

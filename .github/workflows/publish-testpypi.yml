name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: >-
          Expected package version in this ref, for example 0.6.4rc1; the ref must
          include matching committed version-bound deterministic goldens.
        required: true

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}-${{ inputs['expected-version'] }}
  cancel-in-progress: false

env:
  # Match the canonical release-evidence producer exactly.
  PYTHON_VERSION: "3.14.6"
  SOURCE_DATE_EPOCH: "1783036800"
  # The publish gate replays both closed evidence bundles.
  EMPIRICAL_STUDY_BUNDLE_ROOT: evidence/empirical/real-model-study
  EXTERNAL_PILOT_BUNDLE_ROOT: evidence/empirical/external-pilot
  EXTERNAL_PILOT_EVIDENCE: external-pilot-evidence.json
  EXTERNAL_PILOT_REVIEW_RECEIPT: external-pilot-independence-review.json
  RELEASE_EFFICACY_PACKET: evidence/empirical/release-control-efficacy/evidence-packet.json
  RELEASE_EFFICACY_POLICY: evidence/empirical/release-control-efficacy/controls-mutation.yaml
  RELEASE_EFFICACY_ARTIFACT_ROOT: .

jobs:
  build:
    name: Build distributions without OIDC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      distributions_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      distributions_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require clean source before build
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate expected package version
        env:
          EXPECTED_VERSION: ${{ inputs['expected-version'] }}
        run: python scripts/check_version_matches_tag.py "v${EXPECTED_VERSION}"
      - run: make schema-check
      - run: python scripts/check_tagged_schema_immutability.py --require-release-tags
      - name: Verify committed version-bound deterministic goldens
        run: python scripts/update_golden.py
      - name: Run release checks for the requested version
        env:
          EXPECTED_RELEASE: ${{ inputs['expected-version'] }}
        run: make release-publish-check EXPECTED_RELEASE="${EXPECTED_RELEASE}"
      - name: Validate exact distribution set
        run: python scripts/check_wheel_contents.py --dist dist
      - name: Require clean source after build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"
      - name: Upload exact candidate distributions
        id: upload
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testpypi-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  reproduce:
    name: Fresh-job rebuild candidate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          merge-multiple: true
          path: .tmp/published-dist
      - name: Validate downloaded candidate set
        run: python scripts/check_wheel_contents.py --dist .tmp/published-dist
      - name: Verify committed version-bound deterministic goldens
        run: python scripts/update_golden.py
      - name: Rebuild candidate in a fresh job
        env:
          EXPECTED_VERSION: ${{ inputs['expected-version'] }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_version_matches_tag.py "v${EXPECTED_VERSION}"
          make schema-check
          python scripts/check_tagged_schema_immutability.py --require-release-tags
          make release-publish-check EXPECTED_RELEASE="${EXPECTED_VERSION}"
          python scripts/check_wheel_contents.py --dist dist
      - name: Compare exact distribution bytes
        shell: bash
        run: |
          set -euo pipefail
          diff \
            <(cd .tmp/published-dist && sha256sum *.whl *.tar.gz | sort) \
            <(cd dist && sha256sum *.whl *.tar.gz | sort)
      - name: Require clean source after reproduction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"

  testpypi-publish:
    name: Publish verified distributions to TestPyPI
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agent-assure
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          merge-multiple: true
          path: dist
      # pypa/gh-action-pypi-publish@v1.14.0
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: >-
          Expected package version in this ref, for example 0.6.4rc1; the ref must
          include matching committed version-bound deterministic goldens.
        required: true

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}-${{ inputs['expected-version'] }}
  cancel-in-progress: false

env:
  # Match the canonical release-evidence producer exactly.
  PYTHON_VERSION: "3.14.6"
  SOURCE_DATE_EPOCH: "1783036800"
  # The publish gate replays both closed evidence bundles.
  EMPIRICAL_STUDY_BUNDLE_ROOT: evidence/empirical/real-model-study
  EXTERNAL_PILOT_BUNDLE_ROOT: evidence/empirical/external-pilot
  EXTERNAL_PILOT_EVIDENCE: external-pilot-evidence.json
  EXTERNAL_PILOT_REVIEW_RECEIPT: external-pilot-independence-review.json
  RELEASE_EFFICACY_PACKET: evidence/empirical/release-control-efficacy/evidence-packet.json
  RELEASE_EFFICACY_POLICY: evidence/empirical/release-control-efficacy/controls-mutation.yaml
  RELEASE_EFFICACY_ARTIFACT_ROOT: .

jobs:
  build:
    name: Build distributions without OIDC
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      distributions_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      distributions_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      source_sha: ${{ steps.source-identity.outputs.value }}
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bind build to the dispatched source commit
        id: source-identity
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "${source_sha}" = "${GITHUB_SHA}"
          printf 'value=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Require clean source before build
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate expected package version
        env:
          EXPECTED_VERSION: ${{ inputs['expected-version'] }}
        run: python scripts/check_version_matches_tag.py "v${EXPECTED_VERSION}"
      - run: make schema-check
      - run: python scripts/check_tagged_schema_immutability.py --require-release-tags
      - name: Verify committed version-bound deterministic goldens
        run: python scripts/update_golden.py
      - name: Run release checks for the requested version
        env:
          EXPECTED_RELEASE: ${{ inputs['expected-version'] }}
        run: make release-publish-check EXPECTED_RELEASE="${EXPECTED_RELEASE}"
      - name: Validate exact distribution set
        run: python scripts/check_wheel_contents.py --dist dist
      - name: Require clean source after build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"
      - name: Upload exact candidate distributions
        id: upload
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testpypi-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  reproduce:
    name: Fresh-job rebuild candidate
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # actions/download-artifact@v8
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          merge-multiple: true
          path: .tmp/published-dist
      - name: Validate downloaded candidate set
        run: python scripts/check_wheel_contents.py --dist .tmp/published-dist
      - name: Verify committed version-bound deterministic goldens
        run: python scripts/update_golden.py
      - name: Rebuild candidate in a fresh job
        env:
          EXPECTED_VERSION: ${{ inputs['expected-version'] }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_version_matches_tag.py "v${EXPECTED_VERSION}"
          make schema-check
          python scripts/check_tagged_schema_immutability.py --require-release-tags
          make release-publish-check EXPECTED_RELEASE="${EXPECTED_VERSION}"
          python scripts/check_wheel_contents.py --dist dist
      - name: Compare exact distribution bytes
        shell: bash
        run: |
          set -euo pipefail
          diff \
            <(cd .tmp/published-dist && sha256sum *.whl *.tar.gz | sort) \
            <(cd dist && sha256sum *.whl *.tar.gz | sort)
      - name: Require clean source after reproduction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"

  candidate-security:
    name: Audit exact candidate dependencies and credential material
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # actions/download-artifact@v8
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          merge-multiple: true
          path: .tmp/security-dist
      - name: Scan exact wheel and sdist for embedded credential material
        run: python scripts/check_wheel_contents.py --dist .tmp/security-dist
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-min.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-langgraph.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-adk.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-otel.lock
          require-hashes: true
          no-deps: true

  candidate-lower-bounds:
    name: Qualify exact candidate lower bounds / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      - run: python -m pip install --require-hashes -r requirements-min.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed direct dependencies equal declared floors
        run: python scripts/check_dependency_lock_freshness.py --verify-installed-minimums
      - run: python -m pip check
      - name: Run the complete suite against the exact candidate lower bounds
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp "${RUNNER_TEMP}/pytest-testpypi-lower-bounds"

  candidate-platform-audit:
    name: Audit exact candidate locks / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.14"]
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.source_sha }}
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-min.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-langgraph.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-adk.lock
          require-hashes: true
          no-deps: true
      # pypa/gh-action-pip-audit@v1.1.0
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266
        with:
          inputs: requirements-otel.lock
          require-hashes: true
          no-deps: true

  testpypi-publish:
    name: Publish verified distributions to TestPyPI
    needs:
      [
        build,
        reproduce,
        candidate-security,
        candidate-lower-bounds,
        candidate-platform-audit,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agent-assure
    permissions:
      id-token: write
    steps:
      # actions/download-artifact@v8
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          merge-multiple: true
          path: dist
      # pypa/gh-action-pypi-publish@v1.14.0
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

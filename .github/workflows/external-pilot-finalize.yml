name: external pilot 2 - finalize

on:
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: Numeric run ID from the completed external pilot capture
        required: true
        type: string
      capture_run_attempt:
        description: Numeric capture attempt (normally 1)
        required: true
        default: "1"
        type: string
      friction_assessment:
        description: Your assessment after inspecting the capture run
        required: true
        type: choice
        options:
          - no_friction_observed
          - friction_observed
      friction_category:
        description: If friction was observed, select its primary category
        required: true
        type: choice
        options:
          - other
          - installation
          - configuration
          - diagnostics
          - continuous_integration
          - runtime
          - documentation
      grant_privacy_filtered_publication:
        description: I authorize documented prospective publication, 14-day fork storage/read access, and input-digest/opaque correlation
        required: true
        default: false
        type: boolean
      reattest_independent_non_maintainer:
        description: I operated the capture in a fork I control and acblabs did not operate it
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate the participant finalization request
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CAPTURE_RUN_ATTEMPT: ${{ inputs.capture_run_attempt }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
          CONSENT_GRANTED: ${{ inputs.grant_privacy_filtered_publication }}
          CONTROL_ATTESTED: ${{ inputs.reattest_independent_non_maintainer }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          [[ "${CAPTURE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CAPTURE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          test "${CONSENT_GRANTED}" = "true"
          test "${CONTROL_ATTESTED}" = "true"
          test "${TRIGGERING_ACTOR}" = "${ACTOR}"
          test "${REPOSITORY_OWNER,,}" != "acblabs"
          gh api \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}" \
            | jq -e \
              '(.fork == true) and (.parent.full_name == "acblabs/agent-assure")' \
              >/dev/null

      - name: Download the exact capture run
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: external-pilot-capture-${{ inputs.capture_run_id }}-${{ inputs.capture_run_attempt }}
          path: ${{ runner.temp }}/external-pilot-capture
          repository: ${{ github.repository }}
          run-id: ${{ inputs.capture_run_id }}
          github-token: ${{ github.token }}

      - name: Check out the immutable upstream source used for the capture
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: acblabs/agent-assure
          ref: d5c3a3f7508be5a8c1ab11c1be4a1bf8bd9e4651
          path: agent-assure-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Build a clean trusted verifier and locate the captured wheel
        id: distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/pilot-venv"
          "${RUNNER_TEMP}/pilot-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r agent-assure-source/requirements.lock
          mkdir -p "${RUNNER_TEMP}/trusted-verifier-dist"
          "${RUNNER_TEMP}/pilot-venv/bin/python" -m pip wheel \
            --disable-pip-version-check \
            --no-build-isolation \
            --no-deps \
            --wheel-dir "${RUNNER_TEMP}/trusted-verifier-dist" ./agent-assure-source
          shopt -s nullglob
          trusted_wheels=("${RUNNER_TEMP}"/trusted-verifier-dist/agent_assure-*.whl)
          captured_wheels=("${RUNNER_TEMP}"/external-pilot-capture/agent_assure-*.whl)
          test "${#trusted_wheels[@]}" -eq 1
          test "${#captured_wheels[@]}" -eq 1
          "${RUNNER_TEMP}/pilot-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            "${trusted_wheels[0]}"
          source_revision="$(git -C agent-assure-source rev-parse HEAD)"
          printf 'wheel_name=%s\n' "$(basename "${trusted_wheels[0]}")" >> "${GITHUB_OUTPUT}"
          printf 'source_revision=%s\n' "${source_revision}" >> "${GITHUB_OUTPUT}"

      - name: Record friction and consent and verify the candidate bundle
        shell: bash
        env:
          AGENT_ASSURE_PILOT_PARENT_REPOSITORY: acblabs/agent-assure
          AGENT_ASSURE_PILOT_REPOSITORY_IS_FORK: "true"
          CAPTURE_RUN_ATTEMPT: ${{ inputs.capture_run_attempt }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
          EXPECTED_SOURCE_REVISION: ${{ steps.distribution.outputs.source_revision }}
          FRICTION_ASSESSMENT: ${{ inputs.friction_assessment }}
          FRICTION_CATEGORY: ${{ inputs.friction_category }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/pilot-venv/bin/python" -I \
            -m agent_assure.external_pilot_kit finalize \
            --capture-root "${RUNNER_TEMP}/external-pilot-capture" \
            --bundle-root "${RUNNER_TEMP}/external-pilot-candidate" \
            --expected-source-revision "${EXPECTED_SOURCE_REVISION}" \
            --capture-run-id "${CAPTURE_RUN_ID}" \
            --capture-run-attempt "${CAPTURE_RUN_ATTEMPT}" \
            --friction-assessment "${FRICTION_ASSESSMENT}" \
            --friction-category "${FRICTION_CATEGORY}" \
            --publication-consent-granted \
            --non-maintainer-control-attested

      - name: Upload the closed pre-review candidate
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-pilot-candidate-${{ inputs.capture_run_id }}-${{ inputs.capture_run_attempt }}
          path: |
            ${{ runner.temp }}/external-pilot-candidate/environment-control-evidence.json
            ${{ runner.temp }}/external-pilot-candidate/environment-manifest.json
            ${{ runner.temp }}/external-pilot-candidate/command-execution-evidence.json
            ${{ runner.temp }}/external-pilot-candidate/input-manifest.json
            ${{ runner.temp }}/external-pilot-candidate/${{ steps.distribution.outputs.wheel_name }}
            ${{ runner.temp }}/external-pilot-candidate/assurance-mutation-campaign.json
            ${{ runner.temp }}/external-pilot-candidate/friction-assessment.json
            ${{ runner.temp }}/external-pilot-candidate/remediation-record.json
            ${{ runner.temp }}/external-pilot-candidate/publication-consent.json
            ${{ runner.temp }}/external-pilot-candidate/external-pilot-evidence.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

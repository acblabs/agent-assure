name: ci
on:
  push:
    paths-ignore:
      - "agent-assure-pilot/**"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    # The bounded 4,096-cluster journal transport regressions are deliberately
    # expensive. Keep this aligned with the sharded coverage qualification.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: make release-check
      - run: python scripts/update_golden.py
  dependency-lower-bounds:
    name: dependency lower bounds / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements-min.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed direct dependencies equal their declared floors
        run: >-
          python scripts/check_dependency_lock_freshness.py
          --verify-installed-minimums
      - name: Verify the installed minimum dependency graph is compatible
        run: python -m pip check
      - name: Run the full suite against declared dependency lower bounds
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp "$RUNNER_TEMP/pytest-dependency-lower-bounds"
  composite-action-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise the local composite action migration profile on a real runner
        uses: ./.github/actions/agent-assure
        with:
          suite: examples/prior_auth_synthetic/suite.yaml
          candidate-variant: examples/prior_auth_synthetic/variants/baseline.yaml
          out-dir: ${{ runner.temp }}/agent-assure-composite-smoke
          report-mode: full
          allow-missing-efficacy-for-migration: "true"
          upload-reports: "false"
          upload-full-artifacts: "false"
      - name: Verify the non-assurance smoke outputs
        env:
          AGENT_ASSURE_SMOKE_OUT: ${{ runner.temp }}/agent-assure-composite-smoke
        run: |
          set -euo pipefail
          required=(
            "suite.compiled.json"
            "fixtures.json"
            "candidate.runset.json"
            "reports/evaluation-report.json"
            "reports/evaluation-summary.json"
            "reports/evidence-packet.json"
            "reports/release-artifact-manifest.json"
          )
          for relative_path in "${required[@]}"; do
            test -s "${AGENT_ASSURE_SMOKE_OUT}/${relative_path}"
          done
          agent-assure validate \
            "${AGENT_ASSURE_SMOKE_OUT}/reports/evidence-packet.json" \
            --kind evidence-packet
  composite-action-strict-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Build deterministic strict-efficacy inputs
        run: |
          set -euo pipefail
          agent-assure init controls-mutation \
            --out-dir .tmp/composite-strict-efficacy
          agent-assure controls mutate \
            --suite .tmp/composite-strict-efficacy/suite.yaml \
            --runset .tmp/composite-strict-efficacy/runset.json \
            --catalog core/v1 \
            --operator drop-material-evidence-link \
            --out .tmp/composite-strict-efficacy/mutation-results
          agent-assure controls efficacy \
            --config .tmp/composite-strict-efficacy/controls-mutation.yaml
      - name: Exercise the local composite action strict profile on a real runner
        uses: ./.github/actions/agent-assure
        with:
          suite: examples/prior_auth_synthetic/suite.yaml
          candidate-variant: examples/prior_auth_synthetic/variants/baseline.yaml
          out-dir: .tmp/agent-assure-composite-strict
          report-mode: full
          control-efficacy-report: .tmp/composite-strict-efficacy/control-efficacy/control-efficacy-report.json
          efficacy-policy: .tmp/composite-strict-efficacy/controls-mutation.yaml
          upload-reports: "false"
          upload-full-artifacts: "false"
      - name: Verify the strict assurance smoke outputs and gate
        env:
          AGENT_ASSURE_STRICT_OUT: .tmp/agent-assure-composite-strict
          AGENT_ASSURE_STRICT_POLICY: .tmp/composite-strict-efficacy/controls-mutation.yaml
        run: |
          set -euo pipefail
          required=(
            "suite.compiled.json"
            "fixtures.json"
            "candidate.runset.json"
            "reports/evaluation-report.json"
            "reports/evaluation-summary.json"
            "reports/evidence-packet.json"
            "reports/assurance-evidence-graph.json"
            "reports/release-artifact-manifest.json"
          )
          for relative_path in "${required[@]}"; do
            test -s "${AGENT_ASSURE_STRICT_OUT}/${relative_path}"
          done
          agent-assure validate \
            "${AGENT_ASSURE_STRICT_OUT}/reports/evidence-packet.json" \
            --kind evidence-packet
          agent-assure ci gate \
            "${AGENT_ASSURE_STRICT_OUT}/reports/evidence-packet.json" \
            --artifact-root "${GITHUB_WORKSPACE}" \
            --efficacy-policy "${AGENT_ASSURE_STRICT_POLICY}" \
            --require-efficacy \
            --fail-on-warn \
            --fail-on-not-evaluated
  coverage-shards:
    name: coverage / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # The maximum 4,096-cluster retry-journal round trip writes and reloads
    # RunSets above the ordinary 16 MiB limit and is expensive under branch
    # instrumentation. Keep a finite bound with measured headroom.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: unit-a
            test_paths: >-
              tests/unit/adapters tests/unit/authoring tests/unit/canonical
              tests/unit/compare tests/unit/controls tests/unit/demo tests/unit/docs
              tests/unit/evaluation tests/unit/examples tests/unit/fixtures
              tests/unit/graph tests/unit/mutation
          - shard: unit-b1
            test_paths: >-
              tests/unit/policies tests/unit/privacy tests/unit/rag
              tests/unit/release tests/unit/reporting
          - shard: unit-b2
            test_paths: >-
              tests/unit/runner tests/unit/schema tests/unit/statistics
              tests/unit/streaming tests/unit/study tests/unit/telemetry tests/unit/usage
          - shard: unit-top
            test_paths: tests/unit/test_*.py
          - shard: integration
            test_paths: tests/integration
    env:
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run branch-coverage shard
        run: >-
          python -m pytest -p no:cacheprovider
          --basetemp "$RUNNER_TEMP/pytest-${{ matrix.shard }}"
          --cov=agent_assure --cov-branch --cov-report= --cov-fail-under=0
          ${{ matrix.test_paths }}
      - name: Upload exact coverage database
        if: ${{ always() }}
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  coverage-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: coverage-shards
    if: ${{ always() }}
    steps:
      - name: Require every coverage shard to succeed
        if: ${{ needs.coverage-shards.result != 'success' }}
        run: exit 1
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Download all coverage databases
        # actions/download-artifact@v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: .coverage-data
          merge-multiple: true
      - name: Verify exact usable shard inventory
        run: >-
          python scripts/check_coverage_gate.py inventory
          --artifact-dir .coverage-data
          --expected .coverage.unit-a
          --expected .coverage.unit-b1
          --expected .coverage.unit-b2
          --expected .coverage.unit-top
          --expected .coverage.integration
      - name: Combine coverage and enforce the combined floor
        run: |
          python -m coverage combine --keep .coverage-data
          python -m coverage report
          python -m coverage json -o coverage.json
      - name: Enforce the pure branch floor
        run: >-
          python scripts/check_coverage_gate.py branches
          --report coverage.json --fail-under 68
          --critical-prefix src/agent_assure/live/=65
          --critical-prefix src/agent_assure/privacy/=78
          --critical-prefix src/agent_assure/mutation/=74
          --critical-prefix src/agent_assure/study/=78
          --critical-prefix src/agent_assure/schema/=67
          --critical-prefix src/agent_assure/policies/=85
          --critical-prefix src/agent_assure/statistics/=82
          --critical-prefix src/agent_assure/cli/=67
  windows-containment:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise the Windows runner and rooted I/O suites
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp "${{ runner.temp }}/pytest-windows-runner"
          tests/unit/runner
          tests/unit/test_rooted_io.py
      - name: Require native Windows path and process containment
        run: >-
          python -m pytest -q -p no:cacheprovider --fail-on-skip
          --basetemp "${{ runner.temp }}/pytest-windows-containment"
          tests/unit/test_rooted_io.py::test_rooted_read_pins_nested_file_and_preserves_bounded_metadata
          tests/unit/test_rooted_io.py::test_rooted_descriptor_lease_rewinds_and_closes_file_descriptor
          tests/unit/test_rooted_io.py::test_rooted_directory_lease_pins_nested_directory_and_root
          tests/unit/test_rooted_io.py::test_rooted_directory_claim_owns_independent_pins_and_writer_operations
          tests/unit/test_rooted_io.py::test_windows_rooted_directory_claim_blocks_rename_until_close
          tests/unit/test_rooted_io.py::test_rooted_read_rejects_unsafe_and_windows_ambiguous_paths
          tests/unit/test_rooted_io.py::test_rooted_read_rejects_linked_parent_escape
          tests/unit/test_rooted_io.py::test_rooted_directory_lease_blocks_lexical_rename_until_close
          tests/unit/runner/test_subprocess_harness.py::test_external_script_adapter_invokes_script_with_trace_context
          tests/unit/runner/test_subprocess_harness.py::test_external_script_stdout_is_bounded
          tests/unit/runner/test_subprocess_harness.py::test_external_script_timeout_terminates_descendant_process_tree
          tests/unit/runner/test_subprocess_harness.py::test_post_spawn_validation_failure_terminates_and_reaps_suspended_process
          tests/unit/runner/test_subprocess_harness.py::test_windows_external_script_success_kills_descendant_when_job_closes
          tests/integration/test_evidence_sensitivity_cli.py::test_responsive_subject_emits_a_verdict_bearing_pass_and_renderings
  schema-immutability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python scripts/check_tagged_schema_immutability.py --require-release-tags
  langgraph-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements-langgraph.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Require the real LangGraph dependency
        run: python -c "from langgraph.graph import StateGraph; print(StateGraph.__module__)"
      - run: pytest -q -p no:cacheprovider --basetemp .tmp/pytest-langgraph tests/integration/test_langgraph_expense_assurance.py
  adk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements-adk.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Require the real Google ADK dependency
        run: python -c "from google.adk.events.event import Event; from google.adk.events.event_actions import EventActions; print(Event.__module__, EventActions.__module__)"
      - run: pytest -q -p no:cacheprovider --basetemp .tmp/pytest tests/unit/adapters/test_adk_adapter.py::test_adk_adapter_reads_real_google_adk_event_when_available
  otel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python@v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements-otel.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Require the real OpenTelemetry compatibility line
        run: python -c "from opentelemetry.context import Context; from opentelemetry.sdk.trace import TracerProvider; from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter; print(Context.__module__, TracerProvider.__module__, OTLPSpanExporter.__module__)"
      - name: Exercise the real SDK and OTLP HTTP private contract
        run: >-
          pytest -q -p no:cacheprovider --fail-on-skip
          --basetemp "$RUNNER_TEMP/pytest-otel-contract"
          tests/unit/telemetry/test_otel_sdk.py
          tests/unit/test_otel_cli.py

name: evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  # Evidence identity binds the exact runtime; do not float the producer patch.
  PYTHON_VERSION: "3.14.6"
  COSIGN_VERSION: "v3.0.6"
  SOURCE_DATE_EPOCH: "1783036800"

jobs:
  build:
    name: Build evidence without OIDC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bundle_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve expected package release
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*)?$ ]]
          printf 'value=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Validate immutable signing source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_version_matches_tag.py "${GITHUB_REF_NAME}"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Build release bundle from a clean source tree
        run: >
          python scripts/build_release_bundle.py
          --expected-release "${{ steps.package-version.outputs.value }}"
          --out .tmp/release
          --write-digests .tmp/release/release-digest-replay.json
          --source-ref "${GITHUB_REF}"
          --require-clean-source
      - name: Check release distributions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_wheel_contents.py --dist .tmp/release/dist
          python -m twine check .tmp/release/dist/*
          python scripts/smoke_install_wheel.py --dist .tmp/release/dist
      - name: Replay release digests
        run: >
          agent-assure release replay .tmp/release/release-digest-replay.json
          --artifact-root .
          --expect-ref "${GITHUB_REF}"
          --require-current-commit
      - name: Require clean source after evidence build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"
      - name: Upload unsigned evidence bundle
        id: upload
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release
          if-no-files-found: error
          retention-days: 14

  reproduce:
    name: Reproduce and promote signing inputs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verified_bundle_artifact_id: ${{ steps.upload-verified.outputs.artifact-id }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve expected package release
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(rc[1-9][0-9]*)?$ ]]
          printf 'value=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.bundle_artifact_id }}
          merge-multiple: true
          path: .tmp/published
      - name: Rebuild evidence from the same commit
        run: >
          python scripts/build_release_bundle.py
          --expected-release "${{ steps.package-version.outputs.value }}"
          --out .tmp/release
          --write-digests .tmp/release/release-digest-replay.json
          --source-ref "${GITHUB_REF}"
          --require-clean-source
      - name: Compare every future signing input by actual bytes
        run: >
          python scripts/assert_dist_reproducible.py
          .tmp/published
          .tmp/release
          --verified-out .tmp/verified-release
      - name: Replay digests from fresh-job rebuild
        run: >
          agent-assure release replay .tmp/release/release-digest-replay.json
          --artifact-root .
          --expect-ref "${GITHUB_REF}"
          --require-current-commit
      - name: Require clean source after reproduction
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          test -z "${dirty}"
      - name: Upload only verified inputs from fresh-job rebuild
        id: upload-verified
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-unsigned-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/verified-release
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign fixed evidence blobs only
    needs: reproduce
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: signing
    permissions:
      contents: read
      id-token: write
    outputs:
      signed_bundle_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.reproduce.outputs.verified_bundle_artifact_id }}
          merge-multiple: true
          path: .tmp/release
      - name: Install cosign
        # sigstore/cosign-installer@v4.0.0
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign the reviewed fixed artifact set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t distributions < <(find .tmp/release/dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | sort)
          test "${#distributions[@]}" -eq 2
          artifacts=(
            .tmp/release/reports/evidence-packet.json
            .tmp/release/reports/evidence-packet.md
            .tmp/release/reports/assurance-evidence-graph.json
            .tmp/release/reports/release-artifact-manifest.json
            .tmp/release/release-digest-replay.json
            .tmp/release/sbom.cdx.json
            "${distributions[@]}"
          )
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}"
            test ! -L "${artifact}"
            cosign sign-blob --yes --bundle "${artifact}.bundle" "${artifact}"
          done
      - name: Upload signed evidence
        id: upload
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify signatures without OIDC
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      # actions/setup-python@v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.signed_bundle_artifact_id }}
          merge-multiple: true
          path: .tmp/release
      - name: Install cosign
        # sigstore/cosign-installer@v4.0.0
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify workflow identity signatures
        run: >
          python scripts/cosign_release_artifacts.py verify
          --release-dir .tmp/release
          --workflow-name evidence
          --workflow-path .github/workflows/evidence.yml
      - name: Assert modified packet verification fails
        run: >
          python scripts/cosign_release_artifacts.py verify-modified-fails
          --release-dir .tmp/release
          --workflow-name evidence
          --workflow-path .github/workflows/evidence.yml
      - name: Promote verified signed evidence
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-signed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release
          if-no-files-found: error
          retention-days: 30

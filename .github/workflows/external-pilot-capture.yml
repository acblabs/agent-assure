name: external pilot 1 - capture

on:
  workflow_dispatch:
    inputs:
      participant_pseudonym:
        description: Pseudonym (not your GitHub name; see participant guide)
        required: true
        type: string
      attest_independent_non_maintainer:
        description: I am not an agent-assure maintainer and I control this fork and run
        required: true
        default: false
        type: boolean
      consent_to_temporary_actions_storage:
        description: I consent to 14-day fork Actions storage/read access, linkable CI bindings, and committed-input digests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1783036800"

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse an unfinalized execution-source pin
        shell: bash
        run: |
          echo "::error title=External pilot unavailable::The trusted v0.6.6 execution-source commit has not been created and pinned yet. Do not recruit or dispatch this workflow."
          exit 2
      - name: Require a participant-controlled direct fork
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CONTROL_ATTESTED: ${{ inputs.attest_independent_non_maintainer }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TEMPORARY_STORAGE_CONSENT_GRANTED: ${{ inputs.consent_to_temporary_actions_storage }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error title=External pilot eligibility::$1"
            exit 2
          }
          [[ -n "${ACTOR}" ]] || fail "GitHub did not supply the workflow actor."
          [[ "${CONTROL_ATTESTED}" = "true" ]] || fail \
            "Attest non-maintainer control only if the statement is true."
          [[ "${TEMPORARY_STORAGE_CONSENT_GRANTED}" = "true" ]] || fail \
            "Consent to temporary Actions storage is required for Stage 1; otherwise stop."
          [[ "${TRIGGERING_ACTOR}" = "${ACTOR}" ]] || fail \
            "Only the original actor may run or rerun this pilot."
          [[ "${REPOSITORY_OWNER,,}" != "acblabs" ]] || fail \
            "Run this workflow only in a participant-controlled fork."
          if ! gh api \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}" \
            | jq -e \
              '(.fork == true) and (.parent.full_name == "acblabs/agent-assure")' \
              >/dev/null; then
            fail "GitHub could not verify a direct fork of acblabs/agent-assure."
          fi

      - name: Check out the participant fork and committed input
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: participant-repository
          persist-credentials: false

      - name: Check out the immutable upstream execution source
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: acblabs/agent-assure
          ref: 0000000000000000000000000000000000000000
          path: agent-assure-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Create a clean environment and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/pilot-venv"
          "${RUNNER_TEMP}/pilot-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r agent-assure-source/requirements.lock

      - name: Build and install the exact tested wheel
        id: distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pilot-dist"
          "${RUNNER_TEMP}/pilot-venv/bin/python" -m pip wheel \
            --disable-pip-version-check \
            --no-build-isolation \
            --no-deps \
            --wheel-dir "${RUNNER_TEMP}/pilot-dist" ./agent-assure-source
          shopt -s nullglob
          wheels=("${RUNNER_TEMP}"/pilot-dist/agent_assure-*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error title=External pilot build::Expected exactly one Agent Assure wheel; found ${#wheels[@]}."
            exit 2
          fi
          "${RUNNER_TEMP}/pilot-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            "${wheels[0]}"
          source_revision="$(git -C agent-assure-source rev-parse HEAD)"
          printf 'wheel=%s\n' "${wheels[0]}" >> "${GITHUB_OUTPUT}"
          printf 'wheel_name=%s\n' "$(basename "${wheels[0]}")" >> "${GITHUB_OUTPUT}"
          printf 'source_revision=%s\n' "${source_revision}" >> "${GITHUB_OUTPUT}"

      - name: Execute and privacy-filter the pilot capture
        shell: bash
        env:
          AGENT_ASSURE_PILOT_PARENT_REPOSITORY: acblabs/agent-assure
          AGENT_ASSURE_PILOT_REPOSITORY_IS_FORK: "true"
          PARTICIPANT_PSEUDONYM: ${{ inputs.participant_pseudonym }}
          SOURCE_REVISION: ${{ steps.distribution.outputs.source_revision }}
          TESTED_WHEEL: ${{ steps.distribution.outputs.wheel }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/pilot-venv/bin/python" -I \
            -m agent_assure.external_pilot_kit capture \
            --capture-root "${RUNNER_TEMP}/external-pilot-capture" \
            --participant-repository-root "${GITHUB_WORKSPACE}/participant-repository" \
            --participant-input agent-assure-pilot/participant-waiver.yaml \
            --participant-input-template \
              "${GITHUB_WORKSPACE}/agent-assure-source/docs/templates/external_pilot_participant_waiver.yaml" \
            --wheel "${TESTED_WHEEL}" \
            --source-revision "${SOURCE_REVISION}" \
            --participant-pseudonym "${PARTICIPANT_PSEUDONYM}" \
            --non-maintainer-control-attested \
            --temporary-storage-consent-granted

      - name: Upload the privacy-filtered capture
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-pilot-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-pilot-capture/external-pilot-capture.json
            ${{ runner.temp }}/external-pilot-capture/environment-control-evidence.json
            ${{ runner.temp }}/external-pilot-capture/environment-manifest.json
            ${{ runner.temp }}/external-pilot-capture/command-execution-evidence.json
            ${{ runner.temp }}/external-pilot-capture/input-manifest.json
            ${{ runner.temp }}/external-pilot-capture/${{ steps.distribution.outputs.wheel_name }}
            ${{ runner.temp }}/external-pilot-capture/assurance-mutation-campaign.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
